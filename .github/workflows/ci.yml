name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --ignore=tests/test_qiskit_reference.py
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/reproduce.py --check

  circuit-and-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
      - run: uv sync --frozen --all-extras --python 3.12
      - run: uv run python -m pytest
      - run: uv run python scripts/reproduce.py --check
      - run: uv run python scripts/reproduce_experiments.py --check
      - run: |
          for notebook in notebooks/*.ipynb; do
            uv run python -m jupyter nbconvert --execute --to notebook \
              --output "/tmp/$(basename "$notebook")" "$notebook"
          done
