[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quantum-pd"
version = "0.1.0"
description = "Reproducible pure-strategy Nash searches for two- to four-player Prisoner's Dilemma"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
verify = ["qiskit>=2,<3", "scipy>=1.16,<2"]
paper = ["reportlab==5.0.1", "matplotlib==3.11.2"]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "nbconvert>=7,<8", "ipykernel>=6,<8"]

[project.scripts]
quantum-pd = "quantum_pd.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
